<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shared icon sprite. Every <svg> used by the dashboard, popup and
  onboarding pages lives here as a <symbol>, referenced from those pages
  via <use href="../shared/icons.svg#icon-name">. Keeps the page markup
  free of inline icon paths.

  Must stay a standalone .svg (not .html) — a cross-document <use> only
  resolves its fragment against a document the browser parses as SVG;
  referencing a symbol inside an .html file renders nothing, even though
  the file itself loads fine.

  Symbols intentionally carry no presentation attributes (fill, stroke,
  stroke-width, …) — each <use>'s own wrapping <svg> sets those, so the
  same symbol can be reused at different stroke weights and still allow
  CSS on the wrapper (fill, color) to inherit into the referenced shapes.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
  <symbol id="icon-panel-left" viewBox="0 0 24 24">
    <rect width="18" height="18" x="3" y="3" rx="2" />
    <path d="M9 3v18" />
  </symbol>

  <symbol id="icon-panel-right" viewBox="0 0 24 24">
    <path d="M4 5h16" />
    <path d="M4 12h16" />
    <path d="M4 19h16" />
  </symbol>

  <symbol id="icon-job" viewBox="0 0 24 24">
    <rect width="7" height="9" x="3" y="3" rx="1" />
    <rect width="7" height="5" x="14" y="3" rx="1" />
    <rect width="7" height="9" x="14" y="12" rx="1" />
    <rect width="7" height="5" x="3" y="16" rx="1" />
  </symbol>

  <symbol id="icon-pen-line" viewBox="0 0 24 24">
    <path d="M12 20h9" />
    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
  </symbol>

  <symbol id="icon-chevron-left" viewBox="0 0 24 24">
    <path d="m15 18-6-6 6-6" />
  </symbol>

  <symbol id="icon-chevron-right" viewBox="0 0 24 24">
    <path d="m9 18 6-6-6-6" />
  </symbol>

  <symbol id="icon-chevron-down" viewBox="0 0 24 24">
    <path d="m6 9 6 6 6-6" />
  </symbol>

  <symbol id="icon-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2" />
    <path d="M12 20v2" />
    <path d="m4.93 4.93 1.41 1.41" />
    <path d="m17.66 17.66 1.41 1.41" />
    <path d="M2 12h2" />
    <path d="M20 12h2" />
    <path d="m6.34 17.66-1.41 1.41" />
    <path d="m19.07 4.93-1.41 1.41" />
  </symbol>

  <symbol id="icon-moon" viewBox="0 0 24 24">
    <path
      d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
  </symbol>

  <symbol id="icon-trash" viewBox="0 0 24 24">
    <path d="M3 6h18" />
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
    <line x1="10" x2="10" y1="11" y2="17" />
    <line x1="14" x2="14" y1="11" y2="17" />
  </symbol>

  <symbol id="icon-check" viewBox="0 0 24 24">
    <path d="m5 12 5 5 9-10" />
  </symbol>

  <symbol id="icon-plus" viewBox="0 0 24 24">
    <path d="M12 5v14" />
    <path d="M5 12h14" />
  </symbol>

  <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
    <path d="M7 7h10v10" />
    <path d="M7 17 17 7" />
  </symbol>

  <symbol id="icon-confirm-check" viewBox="0 0 24 24">
    <path d="M20 6 9 17l-5-5" />
  </symbol>

  <symbol id="icon-close" viewBox="0 0 24 24">
    <path d="M18 6 6 18" />
    <path d="m6 6 12 12" />
  </symbol>

  <symbol id="icon-eye" viewBox="0 0 24 24">
    <path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12Z" />
    <circle cx="12" cy="12" r="3" />
  </symbol>

  <symbol id="icon-eye-off" viewBox="0 0 24 24">
    <path d="M3 3l18 18" />
    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
    <path d="M9.9 5.1A9.7 9.7 0 0 1 12 5c5 0 9 4.5 10 7a12.6 12.6 0 0 1-3 4.2" />
    <path d="M6.6 6.6C4.3 8 2.7 10.2 2 12c1 2.5 5 7 10 7a9.6 9.6 0 0 0 5.4-1.6" />
  </symbol>

  <symbol id="icon-alert-circle" viewBox="0 0 24 24">
