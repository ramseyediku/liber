<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liber Dashboard</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="dashboard__aside" aria-label="Primary navigation">
        <a class="dashboard__brand" href="dashboard.html">Liber</a>
        <nav class="dashboard__nav">
          <a
            class="dashboard__link dashboard__link--active"
            href="dashboard.html"
            aria-current="page">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-layout-dashboard preview-icon">
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
            Applications
          </a>
          <a class="dashboard__link" href="../onboarding/onboarding.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-bolt preview-icon">
              <path
                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
              <circle cx="12" cy="12" r="4" />
            </svg>
            Settings
          </a>
        </nav>
      </aside>

      <main class="dashboard__main">
        <header class="dashboard__header">
          <h1>Hello,</h1>
          <p class="dashboard__greeting" id="greeting"></p>
        </header>

        <table class="dashboard__table" id="jobs-table">
          <thead>
            <tr>
              <th>Company</th>
              <th>Job title</th>
              <th>Platform</th>
              <th>Location</th>
              <th>Date added</th>
              <th>Status</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="jobs-tbody">
            <!-- rows injected by dashboard.js -->
          </tbody>
        </table>

        <p id="empty-state" class="dashboard__empty dashboard__empty--hidden">
          No applications tracked yet. Click "Apply" on any job listing to get
          started.
        </p>
      </main>
    </div>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
