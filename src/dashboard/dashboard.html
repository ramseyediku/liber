<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liber Dashboard</title>
    <script src="../shared/theme.js"></script>
    <link rel="icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard__header">
        <div class="dashboard__brand">
          <img class="logo" src="../assets/logo.png" alt="Liber logo" />
          <span class="dashboard__label">Liber</span>
        </div>
        <div class="dashboard__header-actions">
          <button
            type="button"
            class="dashboard__theme-toggle"
            id="theme-toggle"
            aria-label="Switch to dark mode">
            <!-- src/assets/icons/sun.svg -->
            <svg
              class="theme-icon-sun"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <!-- src/assets/icons/moon.svg -->
            <svg
              class="theme-icon-moon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
            </svg>
          </button>

          <button
            type="button"
            class="dashboard__avatar"
            id="user-avatar"
            aria-label="View profile"></button>
        </div>
      </header>

      <div class="dashboard__cards" id="jobs-cards">
        <!-- cards injected by dashboard.js -->
      </div>

      <button
        type="button"
        class="dashboard__view-full"
        id="expand-view"
        title="Open full view in a new tab">
        View full page
      </button>
    </div>

    <script src="../../vendor/browser-polyfill.js"></script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
