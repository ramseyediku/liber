<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liber Dashboard</title>
    <link rel="icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard__header">
        <div class="dashboard__brand">
          <span class="logo">L</span>
          <div>
            <p class="dashboard__title">My Applications</p>
            <p class="dashboard__greeting" id="greeting"></p>
          </div>
        </div>
        <button
          type="button"
          class="dashboard__expand"
          id="expand-view"
          title="Open full view in a new tab">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M15 3h6v6" />
            <path d="M10 14 21 3" />
            <path
              d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          </svg>
          Full view
        </button>
      </header>

      <div class="dashboard__table-wrap">
        <table class="dashboard__table" id="jobs-table">
          <thead>
            <tr>
              <th>Company</th>
              <th>Job title</th>
              <th class="dashboard__col--full">Platform</th>
              <th class="dashboard__col--full">Location</th>
              <th class="dashboard__col--full">Date added</th>
              <th>Status</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="jobs-tbody">
            <!-- rows injected by dashboard.js -->
          </tbody>
        </table>
      </div>
    </div>

    <script src="../../vendor/browser-polyfill.js"></script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
