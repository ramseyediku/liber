<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liber Dashboard</title>
    <script src="../../dist/shared/theme.js"></script>
    <link rel="icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard__header">
        <div class="dashboard__brand">
          <img class="logo" src="../assets/logo.png" alt="Liber logo" />
          <span class="dashboard__label">Liber</span>
        </div>
      </header>

      <div class="dashboard__signed-out hidden" id="signed-out">
        <p>Sign in to see your applications.</p>
        <button type="button" id="signed-out-signin-btn">Sign in</button>
      </div>

      <ul
        class="dashboard__summary"
        id="status-summary"
        aria-label="Applications by status"
        hidden></ul>

      <div class="dashboard__cards" id="jobs-cards">
        <!-- cards injected by dashboard.js -->
      </div>

      <p class="dashboard__jobs-count" id="jobs-count"></p>

      <button
        type="button"
        class="dashboard__view-full"
        id="expand-view"
        title="View all applications">
        View all applications
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <use href="../shared/icons.svg#icon-arrow-up-right"></use>
        </svg>
      </button>
    </div>

    <!-- Cloned by dashboard-core.js for each card's status pill and menu. -->
    <template id="chevron-down-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-chevron-down"></use>
      </svg>
    </template>

    <template id="check-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-check"></use>
      </svg>
    </template>

    <script src="../../vendor/browser-polyfill.js"></script>
    <script type="module" src="../../dist/dashboard/dashboard.js"></script>
  </body>
</html>
