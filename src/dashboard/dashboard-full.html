<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liber Dashboard</title>
    <script src="../../dist/shared/theme.js"></script>
    <link rel="icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="../../vendor/driver.css" />
    <link rel="stylesheet" href="dashboard-full.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="dashboard__aside" aria-label="Primary navigation">
        <div class="dashboard__brand">
          <a class="dashboard__brand-link" href="dashboard-full.html">
            <img class="logo" src="../assets/logo.png" alt="Liber logo" />
            <span class="dashboard__label">Liber</span>
          </a>

          <button
            type="button"
            class="dashboard__sidebar-toggle"
            id="sidebar-toggle"
            aria-label="Collapse sidebar">
            <svg
              class="sidebar-toggle-icon-collapse"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-panel-left"></use>
            </svg>
            <svg
              class="sidebar-toggle-icon-expand"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-panel-right"></use>
            </svg>
          </button>
        </div>
        <a
          class="dashboard__link dashboard__link--active"
          href="dashboard-full.html"
          aria-current="page"
          aria-label="Applications">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <use href="../shared/icons.svg#icon-job"></use>
          </svg>
          <p class="dashboard__label">Dashboard</p>
        </a>
        <a
          class="dashboard__link"
          href="../settings/settings.html"
          aria-label="Settings">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <use href="../shared/icons.svg#icon-settings"></use>
          </svg>
          <p class="dashboard__label">Settings</p>
        </a>

        <div class="dashboard__sync-row" id="sync-row">
          <svg
            class="dashboard__sync-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <use href="../shared/icons.svg#icon-cloud"></use>
          </svg>
          <div class="dashboard__sync-text">
            <span class="dashboard__sync-label" id="sync-label">Cloud sync</span>
            <span class="dashboard__sync-desc" id="sync-desc"></span>
          </div>
          <button
            type="button"
            role="switch"
            class="dashboard__switch hidden"
            id="sync-switch"
            aria-checked="false"
            aria-labelledby="sync-label"
            aria-describedby="sync-desc">
            <span class="dashboard__switch-knob"></span>
          </button>
          <a
            class="dashboard__switch dashboard__switch--link"
            id="sync-login-link"
            href="../onboarding/login.html"
            aria-label="Cloud sync is off. Log in to turn it on"
            title="Log in to turn on cloud sync">
            <span class="dashboard__switch-knob"></span>
          </a>
        </div>
      </aside>

      <main class="dashboard__main">
        <div class="dashboard__corner">
          <button
            type="button"
            class="dashboard__theme-toggle"
            id="theme-toggle"
            aria-label="Switch to dark mode">
            <svg
              class="theme-icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-sun"></use>
            </svg>
            <svg
              class="theme-icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-moon"></use>
            </svg>
          </button>

          <a class="dashboard__login-btn hidden" id="login-link" href="../onboarding/login.html">Log in</a>

          <button
            type="button"
            class="dashboard__avatar dashboard__avatar--account hidden"
            id="account-trigger"
            aria-haspopup="true"
            aria-label="View profile"></button>
        </div>

        <header class="dashboard__header">
          <h1>My Applications</h1>
          <p class="dashboard__greeting" id="greeting">
            <span class="dashboard__greeting-label">Tracking my applications for</span>
            <span class="dashboard__profession-pill">
              <span id="profession-label"></span>
            </span>
          </p>
          <button
            type="button"
            class="dashboard__logs-trigger"
            id="logs-trigger"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="View scrape activity log">
            Activity Log
          </button>
        </header>

        <div class="dashboard__table-wrap" id="jobs-table-wrap">
          <table class="dashboard__table" id="jobs-table">
            <thead>
              <tr>
                <th>Company</th>
                <th class="dashboard__col--title">Job Title</th>
                <th class="dashboard__col--full dashboard__col--location">Location</th>
                <th class="dashboard__col--full">Date Added</th>
                <th class="dashboard__col--status">Status</th>
                <th class="dashboard__col--notes">Notes</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="jobs-tbody">
              <!-- rows injected by dashboard-full.js -->
            </tbody>
          </table>
        </div>

        <nav
          class="dashboard__pagination"
          id="jobs-pagination"
          aria-label="Pagination">
          <button
            type="button"
            class="dashboard__page-arrow"
            id="pagination-prev"
            aria-label="Previous page">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-chevron-left"></use>
            </svg>
          </button>
          <div class="dashboard__pagination-pages" id="pagination-pages"></div>
          <button
            type="button"
            class="dashboard__page-arrow"
            id="pagination-next"
            aria-label="Next page">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-chevron-right"></use>
            </svg>
          </button>
        </nav>

      </main>
    </div>

    <div class="dashboard__detail-overlay" id="detail-overlay" hidden></div>
    <aside
      class="dashboard__detail"
      id="detail-panel"
      aria-label="Application details"
      hidden>
      <div class="dashboard__detail-header">
        <span class="dashboard__detail-position" id="detail-position"></span>
        <div class="dashboard__detail-nav">
          <button
            type="button"
            class="dashboard__detail-nav-btn"
            id="detail-prev"
            aria-label="Previous application">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-chevron-left"></use>
            </svg>
          </button>
          <button
            type="button"
            class="dashboard__detail-nav-btn"
            id="detail-next"
            aria-label="Next application">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-chevron-right"></use>
            </svg>
          </button>
          <span class="dashboard__detail-divider" aria-hidden="true"></span>
          <button
            type="button"
            class="dashboard__detail-nav-btn"
            id="detail-close"
            aria-label="Close details">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-close"></use>
            </svg>
          </button>
        </div>
      </div>

      <div class="dashboard__detail-body">
        <h2 class="dashboard__detail-role" id="detail-role"></h2>

        <div class="dashboard__detail-status-group">
          <span class="dashboard__detail-status-label" id="detail-status-label"
            >Status</span
          >
          <div
            class="dashboard__detail-status"
            id="detail-status"
            role="radiogroup"
            aria-labelledby="detail-status-label"></div>
        </div>

        <dl class="dashboard__detail-meta">
          <dt>Company</dt>
          <dd id="detail-company"></dd>
          <dt>Location</dt>
          <dd id="detail-location"></dd>
          <dt>Date added</dt>
          <dd id="detail-date"></dd>
        </dl>

        <label class="dashboard__detail-note-label">
          <span>Note</span>
          <textarea
            class="dashboard__detail-note"
            id="detail-note"
            placeholder="Interview dates, contacts, follow-ups…"
            rows="5"></textarea>
        </label>
      </div>

      <div class="dashboard__detail-footer">
        <button
          type="button"
          class="dashboard__detail-delete"
          id="detail-delete">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round">
            <use href="../shared/icons.svg#icon-trash"></use>
          </svg>
          <span>Delete</span>
        </button>
        <button
          type="button"
          class="dashboard__detail-close-btn"
          id="detail-footer-close">
          Close
        </button>
      </div>
    </aside>

    <!-- Cloned per-row by dashboard-core.js for each delete button. -->
    <template id="trash-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-trash"></use>
      </svg>
    </template>

    <!-- Cloned per-row by dashboard-core.js for the status pill. -->
    <template id="chevron-down-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-chevron-down"></use>
      </svg>
    </template>

    <!-- Cloned per-option by dashboard-core.js to mark the selected status. -->
    <template id="check-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-check"></use>
      </svg>
    </template>

    <!-- Cloned per-row by dashboard-core.js for the notes button. -->
    <template id="plus-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round">
        <use href="../shared/icons.svg#icon-plus"></use>
      </svg>
    </template>

    <script src="../../vendor/browser-polyfill.js"></script>
    <script type="module" src="../../dist/dashboard/dashboard-full.js"></script>
  </body>
</html>
