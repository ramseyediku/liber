<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liber Dashboard</title>
    <script src="../shared/theme.js"></script>
    <link rel="icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="dashboard-full.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="dashboard__aside" aria-label="Primary navigation">
        <div class="dashboard__brand">
          <a class="dashboard__brand-link" href="dashboard-full.html">
            <img class="logo" src="../assets/logo.png" alt="Liber logo" />
            <span class="dashboard__label">Liber</span>
          </a>

          <button
            type="button"
            class="dashboard__sidebar-toggle"
            id="sidebar-toggle"
            aria-label="Collapse sidebar">
            <!-- src/assets/icons/panel-left.svg -->
            <svg
              class="sidebar-toggle-icon-collapse"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
            </svg>
            <!-- src/assets/icons/panel-right.svg -->
            <svg
              class="sidebar-toggle-icon-expand"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M4 5h16" />
              <path d="M4 12h16" />
              <path d="M4 19h16" />
            </svg>
          </button>
        </div>
        <a
          class="dashboard__link dashboard__link--active"
          href="dashboard-full.html"
          aria-current="page"
          aria-label="Applications">
          <!-- src/assets/icons/job.svg -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-layout-dashboard preview-icon">
            <rect width="7" height="9" x="3" y="3" rx="1" />
            <rect width="7" height="5" x="14" y="3" rx="1" />
            <rect width="7" height="9" x="14" y="12" rx="1" />
            <rect width="7" height="5" x="3" y="16" rx="1" />
          </svg>
          <p class="dashboard__label">Dashboard</p>
        </a>
      </aside>

      <main class="dashboard__main">
        <header class="dashboard__header">
          <h1>My Applications</h1>
          <p class="dashboard__greeting" id="greeting"></p>
        </header>

        <div class="dashboard__table-wrap">
          <table class="dashboard__table" id="jobs-table">
            <thead>
              <tr>
                <th>Company</th>
                <th class="dashboard__col--title">Job Title</th>
                <th class="dashboard__col--full">Location</th>
                <th class="dashboard__col--full">Date Added</th>
                <th>Status</th>
                <th>Notes</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="jobs-tbody">
              <!-- rows injected by dashboard-full.js -->
            </tbody>
          </table>
        </div>
      </main>

      <aside class="dashboard__rail" aria-label="Quick actions">
        <button
          type="button"
          class="dashboard__theme-toggle"
          id="theme-toggle"
          aria-label="Switch to dark mode">
          <!-- src/assets/icons/sun.svg -->
          <svg
            class="theme-icon-sun"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
          <!-- src/assets/icons/moon.svg -->
          <svg
            class="theme-icon-moon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path
              d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
          </svg>
        </button>

        <button
          type="button"
          class="dashboard__avatar"
          id="user-avatar"
          aria-label="View profile"></button>
      </aside>
    </div>

    <!-- Cloned per-row by dashboard-core.js for each delete button. -->
    <template id="trash-icon-template">
      <!-- src/assets/icons/trash.svg -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M3 6h18" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        <line x1="10" x2="10" y1="11" y2="17" />
        <line x1="14" x2="14" y1="11" y2="17" />
      </svg>
    </template>

    <script src="../../vendor/browser-polyfill.js"></script>
    <script type="module" src="dashboard-full.js"></script>
  </body>
</html>
