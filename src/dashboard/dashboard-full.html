<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liber Dashboard</title>
    <script src="../shared/theme.js"></script>
    <link rel="icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="dashboard-full.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="dashboard__aside" aria-label="Primary navigation">
        <div class="dashboard__brand">
          <a class="dashboard__brand-link" href="dashboard-full.html">
            <img class="logo" src="../assets/logo.png" alt="Liber logo" />
            <span class="dashboard__label">Liber</span>
          </a>

          <button
            type="button"
            class="dashboard__sidebar-toggle"
            id="sidebar-toggle"
            aria-label="Collapse sidebar">
            <svg
              class="sidebar-toggle-icon-collapse"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-panel-left"></use>
            </svg>
            <svg
              class="sidebar-toggle-icon-expand"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-panel-right"></use>
            </svg>
          </button>
        </div>
        <a
          class="dashboard__link dashboard__link--active"
          href="dashboard-full.html"
          aria-current="page"
          aria-label="Applications">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <use href="../shared/icons.svg#icon-job"></use>
          </svg>
          <p class="dashboard__label">Dashboard</p>
        </a>

        <button
          type="button"
          class="dashboard__sidebar-profile"
          id="sidebar-profile-trigger"
          aria-haspopup="true"
          aria-label="View profile">
          <span
            class="dashboard__avatar dashboard__avatar--sidebar"
            id="user-avatar"
            aria-hidden="true"></span>
          <div class="dashboard__sidebar-profile-text">
            <p class="dashboard__sidebar-profile-name" id="profile-name"></p>
            <p
              class="dashboard__sidebar-profile-profession"
              id="profile-profession"></p>
          </div>
        </button>
      </aside>

      <main class="dashboard__main">
        <header class="dashboard__header">
          <h1>My Applications</h1>
          <p class="dashboard__greeting" id="greeting">
            <span class="dashboard__greeting-label">Tracking my applications for</span>
            <span class="dashboard__profession-pill">
              <span id="profession-label"></span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">
                <use href="../shared/icons.svg#icon-pen-line"></use>
              </svg>
            </span>
          </p>
        </header>

        <div class="dashboard__table-wrap">
          <table class="dashboard__table" id="jobs-table">
            <thead>
              <tr>
                <th>Company</th>
                <th class="dashboard__col--title">Job Title</th>
                <th class="dashboard__col--full">Location</th>
                <th class="dashboard__col--full">Date Added</th>
                <th>Status</th>
                <th>Notes</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="jobs-tbody">
              <!-- rows injected by dashboard-full.js -->
            </tbody>
          </table>
        </div>

        <nav
          class="dashboard__pagination"
          id="jobs-pagination"
          aria-label="Pagination">
          <button
            type="button"
            class="dashboard__page-arrow"
            id="pagination-prev"
            aria-label="Previous page">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-chevron-left"></use>
            </svg>
          </button>
          <div class="dashboard__pagination-pages" id="pagination-pages"></div>
          <button
            type="button"
            class="dashboard__page-arrow"
            id="pagination-next"
            aria-label="Next page">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <use href="../shared/icons.svg#icon-chevron-right"></use>
            </svg>
          </button>
        </nav>
      </main>

      <aside class="dashboard__rail" aria-label="Quick actions">
        <button
          type="button"
          class="dashboard__theme-toggle"
          id="theme-toggle"
          aria-label="Switch to dark mode">
          <svg
            class="theme-icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <use href="../shared/icons.svg#icon-sun"></use>
          </svg>
          <svg
            class="theme-icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <use href="../shared/icons.svg#icon-moon"></use>
          </svg>
        </button>
      </aside>
    </div>

    <!-- Cloned per-row by dashboard-core.js for each delete button. -->
    <template id="trash-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-trash"></use>
      </svg>
    </template>

    <!-- Cloned per-row by dashboard-core.js for the status pill. -->
    <template id="chevron-down-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-chevron-down"></use>
      </svg>
    </template>

    <!-- Cloned per-option by dashboard-core.js to mark the selected status. -->
    <template id="check-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-check"></use>
      </svg>
    </template>

    <!-- Cloned per-row by dashboard-core.js for the notes button. -->
    <template id="plus-icon-template">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round">
        <use href="../shared/icons.svg#icon-plus"></use>
      </svg>
    </template>

    <script src="../../vendor/browser-polyfill.js"></script>
    <script type="module" src="dashboard-full.js"></script>
  </body>
</html>
