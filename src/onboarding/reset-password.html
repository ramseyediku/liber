<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password — Liber</title>
    <script src="../../dist/shared/theme.js"></script>
    <link rel="icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <button
      type="button"
      class="dashboard__theme-toggle onboarding__theme-toggle"
      id="theme-toggle"
      aria-label="Switch to dark mode">
      <svg
        class="theme-icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-sun"></use>
      </svg>
      <svg
        class="theme-icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-moon"></use>
      </svg>
    </button>

    <main class="onboarding onboarding--auth">
      <img class="logo" src="../assets/logo.png" alt="Liber logo" />

      <a class="auth-back" href="login.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <use href="../shared/icons.svg#icon-chevron-left"></use>
        </svg>
        Back to log in
      </a>

      <div id="request-state">
        <h1>Reset your password</h1>
        <p>Enter the email you use for Liber and we'll send you a link to choose a new password.</p>

        <form id="reset-form" method="post">
          <div class="auth-field">
            <label for="email">Email</label>
            <div class="auth-field__control auth-field__control--checkable">
              <input type="email" name="email" id="email" autocomplete="username" inputmode="email" placeholder="you@example.com" required />
              <span class="auth-field__check hidden" id="email-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <use href="../shared/icons.svg#icon-confirm-check"></use>
                </svg>
              </span>
            </div>
            <p class="auth-field__error hidden" id="email-error">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <use href="../shared/icons.svg#icon-alert-circle"></use>
              </svg>
              <span></span>
            </p>
          </div>

          <p class="onboarding__error hidden" id="auth-error"></p>

          <button type="submit" id="submit-btn">Send reset link</button>
        </form>
      </div>

      <div id="sent-state" class="confirmation hidden">
        <div class="setup-state">
          <h2>Check your email</h2>
          <p>
            If there's a Liber account for <strong id="sent-email"></strong>, we've sent a link to
            reset your password. It expires in 1 hour.
          </p>
          <button type="button" id="back-to-login-btn">Back to log in</button>
          <small>
            Didn't get it? Check your spam folder, or
            <button type="button" class="onboarding__link-btn" id="resend-btn">resend it</button>
            ·
            <button type="button" class="onboarding__link-btn" id="use-other-btn">use a different email</button>
          </small>
        </div>
      </div>
    </main>

    <script src="../../vendor/browser-polyfill.js"></script>
    <script type="module" src="../../dist/onboarding/reset-password.js"></script>
  </body>
</html>
