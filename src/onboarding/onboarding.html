<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Welcome to Liber</title>
    <script src="../../dist/shared/theme.js"></script>
    <link rel="icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <button
      type="button"
      class="dashboard__theme-toggle onboarding__theme-toggle"
      id="theme-toggle"
      aria-label="Switch to dark mode">
      <svg
        class="theme-icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-sun"></use>
      </svg>
      <svg
        class="theme-icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <use href="../shared/icons.svg#icon-moon"></use>
      </svg>
    </button>

    <main class="onboarding">
      <img class="logo" src="../assets/logo.png" alt="Liber logo" />

      <h1>Welcome to Liber</h1>
      <p>Job tracking made simple.</p>

      <form id="onboarding-form" method="post">
        <label for="name">Your name</label>
        <input type="text" name="name" id="name" placeholder="Alex Morgan" autocomplete="name" required />

        <label for="profession">What profession are you applying for?</label>
        <input
          type="text"
          name="profession"
          id="profession"
          placeholder="Software Engineer"
          required />

        <button type="submit" id="submit-btn">Get started</button>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </main>

    <script src="../../vendor/browser-polyfill.js"></script>
    <script type="module" src="../../dist/onboarding/onboarding.js"></script>
  </body>
</html>
